server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # OCR imports an ES module; browsers require a JavaScript MIME type.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
